<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice — opnaco</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  .inv { max-width: 820px; margin: 10px auto 0; }
  .head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 30px; letter-spacing: -0.02em; }
  .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 26px 0; white-space: pre-line; }
  .total { display: flex; justify-content: flex-end; gap: 30px; font-size: 22px; font-weight: 800; margin-top: 12px; }
  .pay { display: grid; grid-template-columns: 180px 1fr; gap: 22px; margin-top: 26px; align-items: start; }
  #qr svg { width: 180px; height: 180px; background: #fff; padding: 8px; border-radius: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #logo { max-height: 56px; max-width: 200px; margin-bottom: 10px; display: none; }
  @media (max-width: 640px) { .parties, .pay { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="./">opna<span>co</span></a><nav><button class="btn sm" onclick="print()">Print / PDF</button></nav></header>
  <div class="card inv" id="inv"><p class="muted">Loading invoice…</p></div>
  <footer class="foot" id="brand" style="text-align:center">Made with <a href="./">opnaco</a> — free crypto invoices that know when they're paid.</footer>
</div>
<script src="lib.js?v=3"></script>
<script>
const $ = (id) => document.getElementById(id);
let inv, units;

async function main() {
  try { inv = await decodeInvoice(location.hash.slice(1)); } catch { $("inv").innerHTML = `<h2>Invalid invoice link</h2><p class="muted">The link may be truncated. Ask the sender to copy it again.</p>`; return; }
  units = invoiceUnits(inv);
  const c = CHAINS[inv.chain];
  document.title = `Invoice ${inv.n} from ${inv.fn || "opnaco"}`;
  if (inv.p) $("brand").style.display = "none";
  const logo = inv.p && /^data:image\/(webp|png|jpeg);base64,/.test(inv.lg || "") && inv.lg;
  $("inv").innerHTML = `
    <div class="head"><div><img id="logo" alt=""><h1>Invoice ${esc(inv.n)}</h1><div class="muted">Issued ${esc(inv.d)}${inv.due ? " · Due " + esc(inv.due) : ""}</div></div>
      <div style="text-align:right"><span id="status" class="pill warn">Checking payment…</span></div></div>
    <div class="parties"><div><div class="muted">From</div><b>${esc(inv.fn)}</b>\n${esc(inv.fe)}</div><div><div class="muted">Bill to</div><b>${esc(inv.tn)}</b>\n${esc(inv.td)}</div></div>
    <table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th></tr></thead><tbody>
      ${inv.items.map((i) => `<tr><td>${esc(i.d)}</td><td class="num">${i.q}</td><td class="num">${fmtMoney(i.p)}</td><td class="num">${fmtMoney(i.q * i.p)}</td></tr>`).join("")}
    </tbody></table>
    <div class="total"><span>Total due</span><span>${fmtUnits(units)} USDC</span></div>
    ${inv.note ? `<p class="muted" style="white-space:pre-line;margin-top:20px">${esc(inv.note)}</p>` : ""}
    <div class="pay" id="payBox">
      <div id="qr"></div>
      <div>
        <h3 style="margin:0 0 6px">Pay ${fmtUnits(units)} USDC on ${c.name}</h3>
        <p class="muted" style="margin:0 0 10px">Send the <b>exact</b> amount — the last decimals identify this invoice. Network: ${c.name} (chain ${c.id}). Token: native USDC.</p>
        <div class="muted" style="font-size:13px">To address</div><div class="mono">${esc(inv.to)}</div>
        <div class="row noprint" style="margin-top:14px"><button class="btn primary" id="wallet">Pay with browser wallet</button><button class="btn" id="copyAmt">Copy amount</button><button class="btn" id="copyAddr">Copy address</button><button class="btn" id="check">Check payment</button></div>
        <p class="err noprint" id="err"></p><p class="muted noprint" id="progress"></p>
      </div>
    </div>`;
  if (logo) { $("logo").src = logo; $("logo").style.display = "block"; }
  // QR doubles as a tap-to-open link for mobile wallets.
  try { const q = qrcode(0, "M"); q.addData(eip681(inv.chain, inv.to, units)); q.make(); $("qr").innerHTML = `<a href="${eip681(inv.chain, inv.to, units)}" title="Open in wallet app">${q.createSvgTag({ scalable: true, margin: 2 })}</a>`; }
  catch { $("qr").innerHTML = `<p class="muted">QR code unavailable — copy the amount and address instead.</p>`; }
  const amt = (Number(units) / 1e6).toFixed(6);
  const copy = async (btn, text) => { const label = btn.textContent; try { await navigator.clipboard.writeText(text); btn.textContent = "Copied ✓"; } catch { btn.textContent = "Copy failed"; } setTimeout(() => (btn.textContent = label), 1500); };
  $("copyAmt").onclick = () => copy($("copyAmt"), amt);
  $("copyAddr").onclick = () => copy($("copyAddr"), inv.to);
  $("wallet").onclick = async () => {
    $("err").textContent = "";
    try { const h = await payWithWallet(inv.chain, inv.to, units); $("progress").innerHTML = `Sent: <a target="_blank" href="${c.explorer}/tx/${h}">${short(h)}</a>. Confirming…`; waitForPayment(); }
    catch (e) { $("err").textContent = e.message || String(e); }
  };
  $("check").onclick = check;
  check();
}

// After a wallet send, keep checking for ~2 minutes until the transfer is mined.
async function waitForPayment(tries = 12) {
  await new Promise((r) => setTimeout(r, 8000));
  if (!(await check()) && tries > 1) waitForPayment(tries - 1);
}

async function check() {
  $("err").textContent = ""; $("status").className = "pill warn"; $("status").textContent = "Checking payment…";
  try {
    const p = await findPayment(inv, (f, t, l) => ($("progress").textContent = `Scanning ${CHAINS[inv.chain].name} blocks ${f.toLocaleString()}–${t.toLocaleString()} of ${l.toLocaleString()}…`));
    $("progress").textContent = "";
    if (p) {
      $("status").className = "pill ok"; $("status").innerHTML = `Paid ✓`;
      $("payBox").innerHTML = `<div style="grid-column:1/-1" class="notice"><b>Paid in full.</b> ${fmtUnits(units)} USDC from <span class="mono">${short(p.from)}</span> in block ${p.block.toLocaleString()} — <a target="_blank" href="${CHAINS[inv.chain].explorer}/tx/${p.tx}">view transaction</a>.</div>`;
      return true;
    }
    $("status").textContent = "Unpaid";
  } catch (e) { $("status").textContent = "Status unavailable"; $("err").textContent = "Couldn't reach the network: " + (e.message || e); }
  return false;
}
main();
</script>
</body>
</html>
